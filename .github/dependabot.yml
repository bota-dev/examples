# Dependabot version-update configuration.
# Security updates (vulnerability-driven PRs) are enabled separately in repo settings.
# Private @bota-dev packages are not checked (no registry configured) — only public deps.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /end-to-end/recordings/clients/android-kotlin
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /end-to-end/recordings
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      recordings-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /end-to-end/recordings/clients/flutter
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /end-to-end/recordings/clients/react-native
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /end-to-end/web-reference
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      reference-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /react-native
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
