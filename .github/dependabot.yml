# Dependabot version-update configuration.
# Security updates (vulnerability-driven PRs) are enabled separately in repo settings.
# Private @bota-dev packages are not checked (no registry configured) — only public deps.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /end-to-end/recordings/clients/android-kotlin
    # Upgrade the wrapper and Android plugin together with frozen native checks.
    ignore:
      - dependency-name: gradle-wrapper
        update-types: [version-update:semver-major]
      - dependency-name: com.android.application
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /end-to-end/recordings
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      recordings-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /end-to-end/recordings/clients/flutter
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /end-to-end/recordings/clients/react-native
    # Expo 57 owns the compatible React and React Native cohort.
    ignore:
      - dependency-name: "expo*"
        versions: [">=58"]
      - dependency-name: react
        versions: [">=19.3"]
      - dependency-name: "@types/react"
        versions: [">=19.3"]
      - dependency-name: react-native
        versions: [">=0.87"]
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /end-to-end/web-reference
    # typescript-eslint 8.72 supports TypeScript below 6.1.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1"]
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      reference-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /react-native
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
