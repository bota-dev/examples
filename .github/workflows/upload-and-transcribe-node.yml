name: Upload and transcribe Node example

on:
  push:
    branches: [main]
    paths:
      - 'api/upload-and-transcribe-node/**'
      - '.github/workflows/upload-and-transcribe-node.yml'
  pull_request:
    paths:
      - 'api/upload-and-transcribe-node/**'
      - '.github/workflows/upload-and-transcribe-node.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api/upload-and-transcribe-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - run: npm ci
      - run: npm run check
      - run: npm test
