name: Export transcription WebVTT Python example

on:
  push:
    branches: [main]
    paths: ['api/export-transcription-vtt-python/**', '.github/workflows/export-transcription-vtt-python.yml']
  pull_request:
    paths: ['api/export-transcription-vtt-python/**', '.github/workflows/export-transcription-vtt-python.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api/export-transcription-vtt-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python --version
      - run: python -m py_compile main.py test_main.py
      - run: python -m unittest -v
