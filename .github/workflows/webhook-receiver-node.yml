name: Webhook receiver

on:
  push:
    branches: [main]
    paths: ['api/webhook-receiver-node/**', '.github/workflows/webhook-receiver-node.yml']
  pull_request:
    paths: ['api/webhook-receiver-node/**', '.github/workflows/webhook-receiver-node.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api/webhook-receiver-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - run: npm ci
      - run: npm run check
      - run: npm test
