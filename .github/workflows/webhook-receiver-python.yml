name: Python webhook receiver

on:
  push:
    branches: [main]
    paths: ['api/webhook-receiver-python/**', '.github/workflows/webhook-receiver-python.yml']
  pull_request:
    paths: ['api/webhook-receiver-python/**', '.github/workflows/webhook-receiver-python.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api/webhook-receiver-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -c "import sys; assert sys.version_info >= (3, 12)"
      - run: python3 -m py_compile server.py
