name: React Native recording sync

on:
  push:
    branches: [main]
    paths: ['end-to-end/react-native-recording-sync/**', '.github/workflows/react-native-recording-sync.yml']
  pull_request:
    paths: ['end-to-end/react-native-recording-sync/**', '.github/workflows/react-native-recording-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: end-to-end/react-native-recording-sync/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - run: npm ci
      - run: npm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: end-to-end/react-native-recording-sync/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export
      - run: npx expo prebuild --platform android --no-install
      - name: Native upload adapter tests and Android application
        run: |
          cd android
          ./gradlew :recording-sync:testDebugUnitTest :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recording-sync-android-${{ github.sha }}
          path: end-to-end/react-native-recording-sync/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
