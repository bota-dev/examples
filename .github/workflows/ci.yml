name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['api/**', 'app-sdk/**', 'end-to-end/**']
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore: ['api/**', 'app-sdk/**', 'end-to-end/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: |
          node -e 'const os = require("node:os"); const v8 = require("node:v8"); console.log(JSON.stringify({arch: process.arch, memoryMiB: Math.round(os.totalmem()/1048576), heapMiB: Math.round(v8.getHeapStatistics().heap_size_limit/1048576)}));'
          npx expo export --platform all --max-workers 1
        working-directory: apps/react-native
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  android-build:
    name: Android native (${{ matrix.architecture }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          # Expo generates the Gradle project after dependency installation.
          cache-dependency-path: |
            package-lock.json
            apps/react-native/app.json
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/react-native
      - run: ./gradlew :app:assembleDebug --no-daemon --build-cache -PreactNativeArchitectures="$TARGET_ARCHITECTURE"
        working-directory: apps/react-native/android
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}

  android:
    name: Android native example
    needs: android-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Android architecture
        env:
          BUILD_RESULT: ${{ needs.android-build.result }}
        run: test "$BUILD_RESULT" = success
