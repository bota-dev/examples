name: Flutter device connect

on:
  push:
    branches: [main]
    paths: ['app-sdk/flutter-device-connect/**', '.github/workflows/flutter-device-connect.yml']
  pull_request:
    paths: ['app-sdk/flutter-device-connect/**', '.github/workflows/flutter-device-connect.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-sdk/flutter-device-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter 3.47.5
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter precache --android
      - run: flutter pub get --enforce-lockfile
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - run: node scripts/check-flutter-licenses.mjs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flutter-connect-debug-apk
          path: app-sdk/flutter-device-connect/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: flutter-resolution
          path: app-sdk/flutter-device-connect/pubspec.lock
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: app-sdk/flutter-device-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Flutter 3.47.5
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter precache --ios
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug
      - run: flutter build ios --debug --no-codesign
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: flutter-connect-ios-resolution
          path: |
            app-sdk/flutter-device-connect/pubspec.lock
            app-sdk/flutter-device-connect/ios/Podfile.lock
          if-no-files-found: warn
