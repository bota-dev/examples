name: Web reference app

on:
  push:
    branches: [main]
    paths: ['end-to-end/web-reference/**', 'end-to-end/recordings/**', 'end-to-end/react-native-recording-sync/backend/**', '.github/workflows/web-reference.yml']
  pull_request:
    paths: ['end-to-end/web-reference/**', 'end-to-end/recordings/**', 'end-to-end/react-native-recording-sync/backend/**', '.github/workflows/web-reference.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: end-to-end/web-reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - run: npm ci
      - run: npm run license-check
      - run: npm run format:check
      - run: npm run lint
      # Integration tests owns the same Linux server suites on PR/main.
      - if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: npm run test:ui
      - if: runner.os != 'Linux' || github.event_name == 'workflow_dispatch'
        run: npm test
      - run: npm run build
