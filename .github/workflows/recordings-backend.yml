name: Integrated Recordings backend core

on:
  push:
    branches: [main]
    paths: ['end-to-end/recordings/**', 'end-to-end/web-reference/server/**', 'end-to-end/react-native-recording-sync/backend/**', '.github/workflows/recordings-backend.yml']
  pull_request:
    paths: ['end-to-end/recordings/**', 'end-to-end/web-reference/server/**', 'end-to-end/react-native-recording-sync/backend/**', '.github/workflows/recordings-backend.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: recordings-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: end-to-end/recordings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - run: npm ci
      - run: npm run license-check
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
