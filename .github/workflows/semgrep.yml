name: Semgrep

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Optional immutable 40-character commit SHA for a retrospective scan
        type: string
        required: false
        default: ''
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: sast-${{ github.event.pull_request.number || github.ref }}-${{ inputs.revision || 'current' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.168.0@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e
    env:
      SCANNER_IMAGE: semgrep/semgrep:1.168.0@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e
      RULE_PACKS: '["security-audit","owasp-top-ten","javascript","typescript","nodejs","react","python","github-actions","kotlin","swift","ruby"]'
      EXPECTED_SHELLCHECK_FILES: '{"app-sdk/android-device-connect/gradlew":"734b3879d3501dce471cf0522d3bcbafe76873d9fc5129345b67fb43bd15e933","app-sdk/android-recording-catalog/gradlew":"734b3879d3501dce471cf0522d3bcbafe76873d9fc5129345b67fb43bd15e933","end-to-end/recordings/clients/android-kotlin/gradlew":"734b3879d3501dce471cf0522d3bcbafe76873d9fc5129345b67fb43bd15e933"}'
    steps:
      - name: Validate retrospective revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_REVISION" && ! "$REQUESTED_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'revision must be a full immutable 40-character commit SHA' >&2
            exit 1
          fi

