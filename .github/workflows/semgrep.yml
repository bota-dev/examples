name: Semgrep

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Optional immutable 40-character commit SHA for a retrospective scan
        type: string
        required: false
        default: ''
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: sast-${{ github.event.pull_request.number || github.ref }}-${{ inputs.revision || 'current' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.168.0@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e
    env:
      SCANNER_IMAGE: semgrep/semgrep:1.168.0@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e
      RULE_PACKS: '["security-audit","owasp-top-ten","javascript","typescript","nodejs","react","python","github-actions","kotlin","swift","ruby"]'
      EXPECTED_SHELLCHECK_FILES: '{"app-sdk/android-device-connect/gradlew":"734b3879d3501dce471cf0522d3bcbafe76873d9fc5129345b67fb43bd15e933","app-sdk/android-recording-catalog/gradlew":"734b3879d3501dce471cf0522d3bcbafe76873d9fc5129345b67fb43bd15e933","end-to-end/recordings/clients/android-kotlin/gradlew":"734b3879d3501dce471cf0522d3bcbafe76873d9fc5129345b67fb43bd15e933"}'
    steps:
      - name: Validate retrospective revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_REVISION" && ! "$REQUESTED_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'revision must be a full immutable 40-character commit SHA' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Trust the checked-out workspace for read-only Git analysis
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Snapshot community security rules and scan identity
        id: identity
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          SOURCE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_WORKFLOW_REF: ${{ github.workflow_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess, urllib.request
          from ruamel.yaml import YAML
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sast-evidence'
          policy = root / 'policy'
          policy.mkdir(parents=True, exist_ok=True)
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          requested = os.environ.get('REQUESTED_REVISION', '')
          if requested and actual.lower() != requested.lower():
              raise SystemExit('Checked-out commit does not match requested immutable revision')
          snapshots = []
          for pack in json.loads(os.environ['RULE_PACKS']):
              url = 'https://semgrep.dev/c/p/' + pack
              request = urllib.request.Request(url, headers={'User-Agent': 'bota-sast-rule-snapshot'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = response.read()
              document = YAML(typ='safe').load(body)
              if not isinstance(document.get('rules'), list) or not document['rules']:
                  raise SystemExit('Rule pack did not contain rules: ' + pack)
              path = policy / (pack + '.yaml')
              path.write_bytes(body)
              snapshots.append({'source': url, 'file': path.name, 'sha256': hashlib.sha256(body).hexdigest(), 'rules': len(document['rules'])})
          identity = {
              'repository': os.environ['GITHUB_REPOSITORY'], 'scanned_sha': actual,
              'requested_revision': requested or None, 'retrospective': bool(requested),
              'original_premerge_verification_claimed': False if requested else None,
              'event': os.environ['GITHUB_EVENT_NAME'], 'github_sha': os.environ['GITHUB_SHA'],
              'workflow_sha': os.environ['SOURCE_WORKFLOW_SHA'], 'workflow_ref': os.environ['SOURCE_WORKFLOW_REF'],
              'pr_head_sha': os.environ.get('PR_HEAD_SHA') or None, 'pr_base_sha': os.environ.get('PR_BASE_SHA') or None,
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'recorded_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'scanner_image': os.environ['SCANNER_IMAGE'],
              'scanner_version': subprocess.check_output(['semgrep', '--version'], text=True).strip(),
              'rule_snapshots': snapshots,
          }
          (root / 'identity.json').write_text(json.dumps(identity, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'scanned_sha': actual, 'retrospective': bool(requested), 'rule_packs': len(snapshots)}))
          PY

      - name: Verify exact sources of reviewed audit annotations
        id: reviewed_annotations
        if: ${{ always() && steps.identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          rules = ('python.lang.security.audit.httpsconnection-detected.httpsconnection-detected',
                   'java.android.security.exported_activity.exported_activity',
                   'javascript.express.security.injection.raw-html-format.raw-html-format')
          annotations = set()
          tracked = subprocess.check_output(['git', 'ls-files', '-z'], cwd=workspace).decode().split('\0')
          for name in filter(None, tracked):
              path = workspace / name
              if path.suffix not in ('.py', '.xml', '.ts'):
                  continue
              for line in path.read_text(encoding='utf-8').splitlines():
                  if 'nosemgrep:' in line:
                      annotations.update((name, rule) for rule in rules if rule in line)
          ledger_path = workspace / '.github/sast-reviewed-findings.json'
          if not ledger_path.exists():
              if annotations:
                  raise SystemExit('Reviewed audit annotations require a matching source ledger')
              print(json.dumps({'reviewed_source_hashes': 0, 'findings': 0, 'ledger': 'absent; ordinary analysis'}))
              raise SystemExit(0)
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          entries = ledger['reviewed_findings'] + ledger['related_sources']
          sources = {entry['path']: entry['source_sha256'] for entry in entries}
          if any(sources[entry['path']] != entry['source_sha256'] for entry in entries):
              raise SystemExit('Conflicting reviewed source hashes')
          for name, digest in sources.items():
              path = (workspace / name).resolve()
              if not path.is_relative_to(workspace):
                  raise SystemExit('Reviewed source path escapes the workspace')
              canonical = path.read_bytes().replace(b'\r\n', b'\n')
              if hashlib.sha256(canonical).hexdigest() != digest:
                  raise SystemExit('Reviewed source changed; recheck its annotation: ' + name)
          approved = {(entry['path'], entry['rule_id']) for entry in ledger['reviewed_findings']}
          if annotations != approved:
              raise SystemExit('Audit annotations do not match the reviewed source ledger')
          print(json.dumps({'reviewed_source_hashes': len(sources), 'findings': len(ledger['reviewed_findings'])}))
          PY

      - name: Install verified ShellCheck for reviewed shell sources
        id: shellcheck_install
        if: ${{ always() && steps.identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, tarfile, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sast-evidence'
          tool = root / 'tools' / 'shellcheck'
          tool.parent.mkdir(parents=True, exist_ok=True)
          url = 'https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz'
          expected = 'b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6'
          with urllib.request.urlopen(url, timeout=60) as response:
              archive_bytes = response.read()
          actual = hashlib.sha256(archive_bytes).hexdigest()
          if actual != expected:
              raise SystemExit('ShellCheck archive SHA-256 mismatch')
          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode='r:gz') as archive:
              member = archive.getmember('shellcheck-v0.11.0/shellcheck')
              if not member.isfile():
                  raise SystemExit('ShellCheck archive member is not a regular file')
              tool.write_bytes(archive.extractfile(member).read())
          tool.chmod(0o755)
          version = subprocess.check_output([str(tool), '--version'], text=True).strip()
          if 'version: 0.11.0' not in version:
              raise SystemExit('Unexpected ShellCheck version')
          receipt = {'source_url': url, 'archive_sha256': actual, 'version': version,
                     'binary_sha256': hashlib.sha256(tool.read_bytes()).hexdigest()}
          (root / 'shellcheck-tool.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'shellcheck_version': '0.11.0', 'archive_sha256': actual}))
          PY

      - name: Analyze exact reviewed shell sources with ShellCheck
        id: shellcheck
        if: ${{ always() && steps.identity.outcome == 'success' && steps.shellcheck_install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sast-evidence'
          expected = json.loads(os.environ['EXPECTED_SHELLCHECK_FILES'])
          sources, absent = [], []
          for name, digest in expected.items():
              path = pathlib.Path(name)
              if not path.exists() and not path.is_symlink():
                  absent.append(name)
                  continue
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('Expected a regular canonical shell source: ' + name)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit('Reviewed shell source changed; review its parser exception: ' + name)
              sources.append({'path': name, 'sha256': actual})
          result = subprocess.run([str(root / 'tools' / 'shellcheck'), '--norc', '--format=json',
                                   *[source['path'] for source in sources]], capture_output=True, text=True) if sources else subprocess.CompletedProcess([], 0, '[]', '')
          (root / 'shellcheck-results.json').write_text(result.stdout, encoding='utf-8')
          (root / 'shellcheck-stderr.txt').write_text(result.stderr, encoding='utf-8')
          findings = json.loads(result.stdout)
          for source in sources:
              if hashlib.sha256(pathlib.Path(source['path']).read_bytes()).hexdigest() != source['sha256']:
                  raise SystemExit('Shell source changed during static analysis')
          receipt = {'version': '0.11.0', 'sources': sources, 'absent_paths': absent, 'exit_code': result.returncode,
                     'findings': len(findings), 'source_execution': False, 'rc_files': False}
          (root / 'shellcheck-summary.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt))
          if result.returncode != 0 or findings:
              raise SystemExit('ShellCheck reported findings or analysis errors')
          PY

      - name: Run full repository security analysis
        id: analysis
        if: ${{ always() && steps.identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          configs=()
          for config in "$RUNNER_TEMP/sast-evidence/policy/"*; do
            configs+=(--config="$config")
          done
          semgrep scan \
            --oss-only --strict --error --metrics=off --disable-version-check --no-rewrite-rule-ids \
            --jobs=2 --timeout=30 \
            --json-output "$RUNNER_TEMP/sast-evidence/results.json" \
            --sarif-output "$RUNNER_TEMP/sast-evidence/results.sarif" \
            --exclude=/app-sdk/android-device-connect/gradlew \
            --exclude=/app-sdk/android-recording-catalog/gradlew \
            --exclude=/end-to-end/recordings/clients/android-kotlin/gradlew \
            "${configs[@]}" .

      - name: Record findings, errors and scanned file count
        if: ${{ always() && steps.identity.outcome == 'success' }}
        env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          SHELLCHECK_OUTCOME: ${{ steps.shellcheck.outcome }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sast-evidence'
          report = json.loads((root / 'results.json').read_text(encoding='utf-8'))
          summary = {'analysis_outcome': os.environ['ANALYSIS_OUTCOME'], 'findings': len(report.get('results', [])), 'errors': len(report.get('errors', [])), 'scanned_files': len(report.get('paths', {}).get('scanned', [])), 'semgrep_version': report.get('version')}
          summary['shellcheck_outcome'] = os.environ['SHELLCHECK_OUTCOME']
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary))
          if not summary['scanned_files']:
              raise SystemExit('SAST scanned zero files; applicability needs a separate review')
          if summary['shellcheck_outcome'] != 'success':
              raise SystemExit('ShellCheck did not complete successfully')
          if summary['errors']:
              raise SystemExit('SAST reported analysis errors; evidence is incomplete')
          PY

      - name: Retain scan identity, exact rules and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sast-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sast-evidence/
          if-no-files-found: error
          retention-days: 90
