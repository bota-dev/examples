      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Trust the checked-out workspace for read-only Git analysis
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Snapshot community security rules and scan identity
        id: identity
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          SOURCE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_WORKFLOW_REF: ${{ github.workflow_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess, urllib.request
          from ruamel.yaml import YAML
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sast-evidence'
          policy = root / 'policy'
          policy.mkdir(parents=True, exist_ok=True)
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          requested = os.environ.get('REQUESTED_REVISION', '')
          if requested and actual.lower() != requested.lower():
              raise SystemExit('Checked-out commit does not match requested immutable revision')
          snapshots = []
          for pack in json.loads(os.environ['RULE_PACKS']):
              url = 'https://semgrep.dev/c/p/' + pack
              request = urllib.request.Request(url, headers={'User-Agent': 'bota-sast-rule-snapshot'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = response.read()
              document = YAML(typ='safe').load(body)
              if not isinstance(document.get('rules'), list) or not document['rules']:
                  raise SystemExit('Rule pack did not contain rules: ' + pack)
              path = policy / (pack + '.yaml')
              path.write_bytes(body)
              snapshots.append({'source': url, 'file': path.name, 'sha256': hashlib.sha256(body).hexdigest(), 'rules': len(document['rules'])})
          identity = {
              'repository': os.environ['GITHUB_REPOSITORY'], 'scanned_sha': actual,
              'requested_revision': requested or None, 'retrospective': bool(requested),
              'original_premerge_verification_claimed': False if requested else None,
              'event': os.environ['GITHUB_EVENT_NAME'], 'github_sha': os.environ['GITHUB_SHA'],
              'workflow_sha': os.environ['SOURCE_WORKFLOW_SHA'], 'workflow_ref': os.environ['SOURCE_WORKFLOW_REF'],
              'pr_head_sha': os.environ.get('PR_HEAD_SHA') or None, 'pr_base_sha': os.environ.get('PR_BASE_SHA') or None,
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'recorded_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'scanner_image': os.environ['SCANNER_IMAGE'],
              'scanner_version': subprocess.check_output(['semgrep', '--version'], text=True).strip(),
              'rule_snapshots': snapshots,
          }
          (root / 'identity.json').write_text(json.dumps(identity, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'scanned_sha': actual, 'retrospective': bool(requested), 'rule_packs': len(snapshots)}))
          PY

      - name: Verify exact sources of reviewed audit annotations
        id: reviewed_annotations
        if: ${{ always() && steps.identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          rules = ('python.lang.security.audit.httpsconnection-detected.httpsconnection-detected',
                   'java.android.security.exported_activity.exported_activity',
                   'javascript.express.security.injection.raw-html-format.raw-html-format')
          annotations = set()
          tracked = subprocess.check_output(['git', 'ls-files', '-z'], cwd=workspace).decode().split('\0')
          for name in filter(None, tracked):
              path = workspace / name
              if path.suffix not in ('.py', '.xml', '.ts'):
                  continue
              for line in path.read_text(encoding='utf-8').splitlines():
                  if 'nosemgrep:' in line:
                      annotations.update((name, rule) for rule in rules if rule in line)
          ledger_path = workspace / '.github/sast-reviewed-findings.json'
          if not ledger_path.exists():
              if annotations:
                  raise SystemExit('Reviewed audit annotations require a matching source ledger')
              print(json.dumps({'reviewed_source_hashes': 0, 'findings': 0, 'ledger': 'absent; ordinary analysis'}))
              raise SystemExit(0)
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          entries = ledger['reviewed_findings'] + ledger['related_sources']
          sources = {entry['path']: entry['source_sha256'] for entry in entries}
          if any(sources[entry['path']] != entry['source_sha256'] for entry in entries):
              raise SystemExit('Conflicting reviewed source hashes')
          for name, digest in sources.items():
              path = (workspace / name).resolve()
              if not path.is_relative_to(workspace):
                  raise SystemExit('Reviewed source path escapes the workspace')
              canonical = path.read_bytes().replace(b'\r\n', b'\n')
              if hashlib.sha256(canonical).hexdigest() != digest:
                  raise SystemExit('Reviewed source changed; recheck its annotation: ' + name)
          approved = {(entry['path'], entry['rule_id']) for entry in ledger['reviewed_findings']}
          if annotations != approved:
              raise SystemExit('Audit annotations do not match the reviewed source ledger')
          print(json.dumps({'reviewed_source_hashes': len(sources), 'findings': len(ledger['reviewed_findings'])}))
          PY

      - name: Install verified ShellCheck for reviewed shell sources
        id: shellcheck_install
        if: ${{ always() && steps.identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, tarfile, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sast-evidence'
          tool = root / 'tools' / 'shellcheck'
          tool.parent.mkdir(parents=True, exist_ok=True)
          url = 'https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz'
          expected = 'b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6'
          with urllib.request.urlopen(url, timeout=60) as response:
              archive_bytes = response.read()
          actual = hashlib.sha256(archive_bytes).hexdigest()
          if actual != expected:
              raise SystemExit('ShellCheck archive SHA-256 mismatch')
          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode='r:gz') as archive:
              member = archive.getmember('shellcheck-v0.11.0/shellcheck')
              if not member.isfile():
                  raise SystemExit('ShellCheck archive member is not a regular file')
              tool.write_bytes(archive.extractfile(member).read())
          tool.chmod(0o755)
          version = subprocess.check_output([str(tool), '--version'], text=True).strip()
          if 'version: 0.11.0' not in version:
              raise SystemExit('Unexpected ShellCheck version')
          receipt = {'source_url': url, 'archive_sha256': actual, 'version': version,
                     'binary_sha256': hashlib.sha256(tool.read_bytes()).hexdigest()}
          (root / 'shellcheck-tool.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'shellcheck_version': '0.11.0', 'archive_sha256': actual}))
          PY

      - name: Analyze exact reviewed shell sources with ShellCheck
        id: shellcheck
        if: ${{ always() && steps.identity.outcome == 'success' && steps.shellcheck_install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sast-evidence'
          expected = json.loads(os.environ['EXPECTED_SHELLCHECK_FILES'])
          sources, absent = [], []
          for name, digest in expected.items():
              path = pathlib.Path(name)
              if not path.exists() and not path.is_symlink():
                  absent.append(name)
                  continue
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('Expected a regular canonical shell source: ' + name)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit('Reviewed shell source changed; review its parser exception: ' + name)
              sources.append({'path': name, 'sha256': actual})
          result = subprocess.run([str(root / 'tools' / 'shellcheck'), '--norc', '--format=json',
                                   *[source['path'] for source in sources]], capture_output=True, text=True) if sources else subprocess.CompletedProcess([], 0, '[]', '')
          (root / 'shellcheck-results.json').write_text(result.stdout, encoding='utf-8')
          (root / 'shellcheck-stderr.txt').write_text(result.stderr, encoding='utf-8')
          findings = json.loads(result.stdout)
          for source in sources:
              if hashlib.sha256(pathlib.Path(source['path']).read_bytes()).hexdigest() != source['sha256']:
                  raise SystemExit('Shell source changed during static analysis')
          receipt = {'version': '0.11.0', 'sources': sources, 'absent_paths': absent, 'exit_code': result.returncode,
                     'findings': len(findings), 'source_execution': False, 'rc_files': False}
          (root / 'shellcheck-summary.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt))
          if result.returncode != 0 or findings:
              raise SystemExit('ShellCheck reported findings or analysis errors')
          PY

      - name: Verify maintained vendor inventory and materialize exact source views
        id: vendor_sources
        if: ${{ always() && steps.identity.outcome == 'success' && steps.vendor_policy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import gzip, hashlib, io, json, os, pathlib, subprocess, tarfile

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sast-evidence'
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          policy_bytes = (root / 'vendor-policy.json').read_bytes()
          policy = json.loads(policy_bytes)
          limits = policy['limits']
          views_root = root / 'vendor-source-views'
          views_root.mkdir(parents=True, exist_ok=False)

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def fail(message):
              raise SystemExit(message)

          def canonical_path(name):
              path = pathlib.PurePosixPath(name)
              if not name or '\0' in name or '\\' in name or ':' in name or pathlib.PureWindowsPath(name).drive or path.is_absolute() or '..' in path.parts or str(path) != name:
                  fail('Noncanonical vendor path: ' + name)
              return path

          def bounded_tar_bytes(data):
              # Bound decompression and inspect raw headers before tarfile can consume
              # PAX/GNU metadata internally. Current payloads need only per-file PAX path.
              with gzip.GzipFile(fileobj=io.BytesIO(data)) as compressed:
                  raw = compressed.read(limits['tar_bytes'] + 1)
              if len(raw) > limits['tar_bytes'] or len(raw) % 512:
                  fail('Archive decompression or block alignment limit failed')
              offset, headers, pax_headers, metadata_total, pending_path = 0, 0, 0, 0, False
              while offset + 512 <= len(raw):
                  header = raw[offset:offset + 512]
                  if header == bytes(512):
                      if pending_path or raw[offset:offset + 1024] != bytes(1024) or any(raw[offset:]):
                          fail('Archive has incomplete metadata or invalid end blocks')
                      return raw, {'expanded_tar_bytes': len(raw), 'raw_headers': headers, 'pax_headers': pax_headers}
                  headers += 1
                  if headers > limits['archive_members']:
                      fail('Raw archive header count limit exceeded')
                  def octal(field):
                      value = field.strip(b'\0 ')
                      if not value or any(byte not in b'01234567' for byte in value):
                          fail('Archive numeric field is not bounded unsigned octal')
                      return int(value, 8)
                  if octal(header[148:156]) != sum(header[:148]) + 8 * 32 + sum(header[156:]):
                      fail('Archive raw header checksum mismatch')
                  size, kind = octal(header[124:136]), header[156:157]
                  end = offset + 512 + ((size + 511) // 512) * 512
                  if size > limits['member_bytes'] or end > len(raw):
                      fail('Raw archive member size exceeds available bounded bytes')
                  if kind == b'x':
                      pax_headers += 1
                      metadata_total += size
                      if pending_path or size > limits['metadata_bytes'] or metadata_total > limits['metadata_total_bytes']:
                          fail('Archive PAX metadata bound exceeded')
                      body = raw[offset + 512:offset + 512 + size]
                      space = body.find(b' ')
                      if space <= 0 or not body[:space].isdigit() or int(body[:space]) != len(body) or not body.endswith(b'\n'):
                          fail('Archive PAX record has invalid finite length')
                      key, separator, value = body[space + 1:-1].partition(b'=')
                      if key != b'path' or not separator or b'\n' in value:
                          fail('Only one bounded per-file PAX path record is supported')
                      name = value.decode('utf-8')
                      canonical_path(name)
                      if not name.startswith('package/'):
                          fail('PAX path must be canonical under package/')
                      pending_path = True
                  elif kind in (b'0', b'\0', b'5'):
                      if kind == b'5' and size:
                          fail('Archive directory has unexpected payload bytes')
                      pending_path = False
                  else:
                      fail('Archive raw type is prohibited, including GNU/global metadata and links')
                  offset = end
              fail('Archive lacks complete finite end blocks')

          entries = {}
          for row in filter(None, subprocess.check_output(['git', 'ls-files', '--stage', '-z'], cwd=workspace).decode().split('\0')):
              metadata, name = row.split('\t', 1)
              mode, oid, stage = metadata.split()
              if 'vendor' not in canonical_path(name).parts:
                  continue
              if name in entries or stage != '0' or mode not in ('100644', '100755'):
                  fail('Vendor inventory has a nonregular or unresolved entry: ' + name)
              entries[name] = {'mode': mode, 'oid': oid}
          expected = {entry['path']: entry for entry in policy['inventory']}
          if len(expected) != len(policy['inventory']) or set(entries) != set(expected):
              fail('Tracked vendor inventory differs from current workflow classification; new=' + repr(sorted(set(entries) - set(expected))) + '; absent=' + repr(sorted(set(expected) - set(entries))))

          source_bytes, sources = {}, []
          for name, entry in expected.items():
              path = workspace / name
              if entries[name]['mode'] != entry['mode']:
                  fail('Vendor source mode changed: ' + name)
              if any(candidate.is_symlink() for candidate in (path, *path.parents)) or not path.is_file():
                  fail('Vendor source must be an ordinary file with ordinary parents: ' + name)
              if not path.resolve().is_relative_to(workspace):
                  fail('Vendor source escapes workspace: ' + name)
              cap = limits['archive_bytes'] if entry['classification'] == 'immutable-archive' else limits['tracked_bytes']
              if not 0 <= entry['bytes'] <= cap:
                  fail('Classified vendor size exceeds finite input cap: ' + name)
              blob_size = int(subprocess.check_output(['git', 'cat-file', '-s', entries[name]['oid']], cwd=workspace, text=True))
              if blob_size != entry['bytes']:
                  fail('Git vendor blob size differs from current classification: ' + name)
              canonical = subprocess.check_output(['git', 'cat-file', 'blob', entries[name]['oid']], cwd=workspace)
              if len(canonical) != entry['bytes'] or digest(canonical) != entry['sha256']:
                  fail('Classified vendor bytes changed; review current policy: ' + name)
              checkout_cap = entry['bytes'] * (2 if entry['text_checkout'] else 1)
              if path.stat().st_size > checkout_cap:
                  fail('Vendor checkout exceeds finite classified size: ' + name)
              with path.open('rb') as stream:
                  working = stream.read(checkout_cap + 1)
              if len(working) > checkout_cap:
                  fail('Vendor checkout grew beyond finite classified size: ' + name)
              # Git's Windows text checkout may expand LF to CRLF. The analyzed view is
              # always the exact canonical Git blob, and neither form is written back.
              if working != canonical and not (entry['text_checkout'] and working.replace(b'\r\n', b'\n') == canonical):
                  fail('Working vendor file differs from its classified Git blob: ' + name)
              source_bytes[name] = canonical
              sources.append({'path': name, 'classification': entry['classification'], 'sha256': digest(canonical),
                              'bytes': len(canonical), 'checkout_sha256': digest(working), 'checkout_bytes': len(working)})

          view_data, archive_receipts = {}, []
          for entry in policy['inventory']:
              if entry['classification'] == 'maintained-source':
                  view_data[entry['view']] = source_bytes[entry['path']]
          if len(view_data) != policy['expected_tracked_sources']:
              fail('Retained vendor source count differs from current classification')

          for entry in policy['archives']:
              data = source_bytes[entry['path']]
              if len(data) > limits['archive_bytes'] or len(data) != entry['bytes'] or digest(data) != entry['sha256']:
                  fail('Archive does not match current immutable provenance: ' + entry['path'])
              raw, preflight = bounded_tar_bytes(data)
              files, names, expanded, count = {}, set(), 0, 0
              with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as archive:
                  for member in archive:
                      count += 1
                      if count > limits['archive_members']:
                          fail('Archive member count limit exceeded')
                      name = member.name.rstrip('/') if member.isdir() else member.name
                      canonical_path(name)
                      if not (name.startswith('package/') or (name == 'package' and member.isdir())) or name in names:
                          fail('Archive member is duplicate or outside package/: ' + name)
                      names.add(name)
                      if member.type not in (tarfile.REGTYPE, tarfile.AREGTYPE, tarfile.DIRTYPE):
                          fail('Archive links, devices and special members are prohibited: ' + name)
                      if member.isdir():
                          continue
                      expanded += member.size
                      if member.size > limits['member_bytes'] or expanded > limits['expanded_bytes']:
                          fail('Archive expanded size limit exceeded')
                      content = archive.extractfile(member).read(limits['member_bytes'] + 1)
                      if len(content) != member.size:
                          fail('Archive member size mismatch: ' + name)
                      files[name] = {'data': content, 'mode': member.mode & 0o777}
              rows = [{'path': name.removeprefix('package/'), 'bytes': len(value['data']), 'mode': value['mode'], 'sha256': digest(value['data'])}
                      for name, value in sorted(files.items())]
              inventory_hash = digest(json.dumps(rows, separators=(',', ':')).encode())
              if len(rows) != entry['members'] or inventory_hash != entry['inventory_sha256']:
                  fail('Archive complete member inventory differs from reviewed provenance: ' + entry['path'])
              for selected in entry['selected']:
                  content = files[selected['member']]['data']
                  if len(content) > limits['view_bytes'] or len(content) != selected['bytes'] or digest(content) != selected['sha256']:
                      fail('Maintained archive source differs from reviewed bytes: ' + selected['member'])
                  if selected['view'] in view_data and view_data[selected['view']] != content:
                      fail('Deduplicated source views are not byte identical')
                  view_data[selected['view']] = content
              archive_receipts.append({'path': entry['path'], 'sha256': digest(data), 'members': len(rows),
                                       'inventory_sha256': inventory_hash, 'selected': entry['selected'], 'provenance': entry['provenance'], 'raw_preflight': preflight})

          if set(view_data) != {view['view'] for view in policy['views']} or len(view_data) != policy['expected_views']:
              fail('Source view population differs from current reviewed classification')
          views = []
          for view in policy['views']:
              name, content = view['view'], view_data[view['view']]
              if canonical_path(name).name != name or pathlib.PurePosixPath(name).suffix not in ('.js', '.ts', '.py'):
                  fail('Expected a flat source view with a recognized language extension')
              if len(content) > limits['view_bytes'] or len(content) != view['bytes'] or digest(content) != view['sha256']:
                  fail('Source view SHA or finite size invariant failed: ' + name)
              (views_root / name).write_bytes(content)
              views.append(view)
          receipt = {'policy_sha256': digest(policy_bytes), 'scanned_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=workspace, text=True).strip(),
                     'source_execution': False, 'source_repacked': False, 'tracked_inventory': sources, 'archives': archive_receipts, 'views': views}
          (root / 'vendor-source-identity.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'tracked_vendor_entries': len(sources), 'derived_archives': len(archive_receipts), 'source_views': len(views), 'source_execution': False}))
          PY

      - name: Analyze maintained vendor source views with the same security rules
        id: vendor_analysis
        if: ${{ always() && steps.identity.outcome == 'success' && steps.vendor_sources.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          configs=()
          for config in "$RUNNER_TEMP/sast-evidence/policy/"*; do
            configs+=(--config="$config")
          done
          cd "$RUNNER_TEMP/sast-evidence/vendor-source-views"
          semgrep scan \
            --oss-only --strict --error --metrics=off --disable-version-check --no-rewrite-rule-ids \
            --jobs=2 --timeout=30 --no-git-ignore --max-target-bytes=1048576 \
            --json-output "$RUNNER_TEMP/sast-evidence/vendor-results.json" \
            --sarif-output "$RUNNER_TEMP/sast-evidence/vendor-results.sarif" \
            "${configs[@]}" .

      - name: Run full repository security analysis
        id: analysis
        if: ${{ always() && steps.identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          configs=()
          for config in "$RUNNER_TEMP/sast-evidence/policy/"*; do
            configs+=(--config="$config")
          done
          semgrep scan \
            --oss-only --strict --error --metrics=off --disable-version-check --no-rewrite-rule-ids \
            --jobs=2 --timeout=30 \
            --json-output "$RUNNER_TEMP/sast-evidence/results.json" \
            --sarif-output "$RUNNER_TEMP/sast-evidence/results.sarif" \
            --exclude=/app-sdk/android-device-connect/gradlew \
            --exclude=/app-sdk/android-recording-catalog/gradlew \
            --exclude=/end-to-end/recordings/clients/android-kotlin/gradlew \
            "${configs[@]}" .

      - name: Record findings, errors and scanned file count
        if: ${{ always() && steps.identity.outcome == 'success' }}
        env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          SHELLCHECK_OUTCOME: ${{ steps.shellcheck.outcome }}
          VENDOR_SOURCES_OUTCOME: ${{ steps.vendor_sources.outcome }}
          VENDOR_ANALYSIS_OUTCOME: ${{ steps.vendor_analysis.outcome }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sast-evidence'
          report = json.loads((root / 'results.json').read_text(encoding='utf-8'))
          summary = {'analysis_outcome': os.environ['ANALYSIS_OUTCOME'], 'findings': len(report.get('results', [])), 'errors': len(report.get('errors', [])), 'scanned_files': len(report.get('paths', {}).get('scanned', [])), 'semgrep_version': report.get('version')}
          summary['shellcheck_outcome'] = os.environ['SHELLCHECK_OUTCOME']
          vendor = {'sources_outcome': os.environ['VENDOR_SOURCES_OUTCOME'], 'analysis_outcome': os.environ['VENDOR_ANALYSIS_OUTCOME']}
          if (root / 'vendor-results.json').exists() and (root / 'vendor-source-identity.json').exists():
              vendor_report = json.loads((root / 'vendor-results.json').read_text(encoding='utf-8'))
              receipt = json.loads((root / 'vendor-source-identity.json').read_text(encoding='utf-8'))
              expected = {view['view'] for view in receipt['views']}
              scanned = vendor_report.get('paths', {}).get('scanned', [])
              vendor.update({'findings': len(vendor_report.get('results', [])), 'errors': len(vendor_report.get('errors', [])),
                             'scanned_files': len(scanned), 'expected_files': len(expected), 'semgrep_version': vendor_report.get('version'),
                             'exact_view_population_scanned': len(scanned) == len(expected) and set(scanned) == expected,
                             'source_views_unchanged': all(hashlib.sha256((root / 'vendor-source-views' / view['view']).read_bytes()).hexdigest() == view['sha256'] for view in receipt['views'])})
          (root / 'vendor-summary.json').write_text(json.dumps(vendor, indent=2) + '\n', encoding='utf-8')
          summary['maintained_vendor'] = vendor
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary))
          if vendor.get('sources_outcome') != 'success' or vendor.get('analysis_outcome') != 'success' or not vendor.get('exact_view_population_scanned') or not vendor.get('source_views_unchanged') or vendor.get('errors') or vendor.get('findings'):
              raise SystemExit('Maintained vendor analysis failed, changed source, or omitted an expected view')
          if not summary['scanned_files']:
              raise SystemExit('SAST scanned zero files; applicability needs a separate review')
          if summary['shellcheck_outcome'] != 'success':
              raise SystemExit('ShellCheck did not complete successfully')
          if summary['errors']:
              raise SystemExit('SAST reported analysis errors; evidence is incomplete')
          PY

      - name: Retain scan identity, exact rules and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sast-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sast-evidence/
          if-no-files-found: error
          retention-days: 90
