name: Swift recording catalog

on:
  push:
    branches: [main]
    paths: ['app-sdk/apple-recording-catalog/**', '.github/workflows/apple-recording-catalog.yml']
  pull_request:
    paths: ['app-sdk/apple-recording-catalog/**', '.github/workflows/apple-recording-catalog.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-sdk/apple-recording-catalog
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: swift package resolve
      - run: bash build.sh
