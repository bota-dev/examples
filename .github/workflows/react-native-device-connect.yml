name: React Native device connect

on:
  push:
    branches: [main]
    paths: ['app-sdk/react-native-device-connect/**', '.github/workflows/react-native-device-connect.yml']
  pull_request:
    paths: ['app-sdk/react-native-device-connect/**', '.github/workflows/react-native-device-connect.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-sdk/react-native-device-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export
      - run: npx expo prebuild --platform android --no-install
      - run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

  ios:
    name: iOS simulator native build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CI: '1'
    defaults:
      run:
        working-directory: app-sdk/react-native-device-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - name: Prepare native tooling
        run: |
          xcodebuild -version
          gem install --no-document cocoapods -v 1.16.2
          echo "$(ruby -e 'print Gem.bindir')" >> "$GITHUB_PATH"
          "$(ruby -e 'print Gem.bindir')/pod" _1.16.2_ --version
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: pod _1.16.2_ install --project-directory=ios
      - name: Build application with the published native SDK
        shell: bash
        run: |
          projects=(ios/*.xcodeproj)
          test "${#projects[@]}" -eq 1
          project="${projects[0]}"
          workspace="${project%.xcodeproj}.xcworkspace"
          scheme="$(basename "$project" .xcodeproj)"
          test -d "$workspace"
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/bota-connect-ios" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/bota-connect-ios.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/bota-connect-ios.log"
              exit 1
            }
          test -d "$RUNNER_TEMP/bota-connect-ios/Build/Products/Debug-iphonesimulator/$scheme.app"
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: react-native-connect-ios-evidence
          path: |
            ${{ runner.temp }}/bota-connect-ios.log
            app-sdk/react-native-device-connect/ios/Podfile.lock
