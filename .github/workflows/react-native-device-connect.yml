name: React Native device connect

on:
  push:
    branches: [main]
    paths: ['app-sdk/react-native-device-connect/**', '.github/workflows/react-native-device-connect.yml']
  pull_request:
    paths: ['app-sdk/react-native-device-connect/**', '.github/workflows/react-native-device-connect.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-sdk/react-native-device-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export
      - run: npx expo prebuild --platform android --no-install
      - run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
