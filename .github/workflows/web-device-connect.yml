name: Web device connect

on:
  push:
    branches: [main]
    paths: ['app-sdk/web-device-connect/**', '.github/workflows/web-device-connect.yml']
  pull_request:
    paths: ['app-sdk/web-device-connect/**', '.github/workflows/web-device-connect.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-sdk/web-device-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
