<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bota device connection</title>
    <style>
      body {
        font: 18px system-ui;
        max-width: 760px;
        margin: 4rem auto;
        padding: 1rem;
      }
      input,
      button {
        font: inherit;
        padding: 0.7rem;
        margin: 0.5rem 0;
      }
      pre {
        white-space: pre-wrap;
      }
      label {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Connect to Bota</h1>
    <p>
      Use desktop Chromium with Bluetooth enabled. Select your device and verify
      its exact serial.
    </p>
    <label>Device serial <input id="serial" autocomplete="off" /></label
    ><button id="connect" disabled>Connect</button
    ><button id="status" disabled>Read status</button
    ><button id="disconnect" disabled>Disconnect</button>
    <pre id="output" role="status">Loading SDK…</pre>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
